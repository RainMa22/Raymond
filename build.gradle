plugins {
    id("java")
    id "application"
    id("com.gradleup.shadow") version "9.6.+"
}
group = "me.rainma22.Raymond"
application.mainClass = group + "." + "Main"

version = "1.0-SNAPSHOT"
String jdaVersion = "6.7.+"
String newPipeVer = "v0.26.+"
String jdaveVer = "0.1.+"
repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation("net.dv8tion:JDA:$jdaVersion")
    implementation("com.github.teamnewpipe:NewPipeExtractor:$newPipeVer")
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.json:json:20240303'
    implementation("club.minnced:jdave-api:$jdaveVer")

    // Compiled natives for libdave for the specified platform
    implementation("club.minnced:jdave-native-linux-x86-64:$jdaveVer")
    implementation("club.minnced:jdave-native-linux-aarch64:$jdaveVer")
    implementation("club.minnced:jdave-native-win-x86-64:$jdaveVer")
    implementation("club.minnced:jdave-native-darwin:$jdaveVer")
    
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
}

java{
    toolchain{
    // require jdk25 for JDave to work... Not optimal
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    //    options.isIncremental = true
    options.compilerArgs << "-Xlint:deprecation"
}

tasks.withType(Zip).configureEach{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE;
}
tasks.withType(Tar).configureEach{
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE;
}


tasks.test {
    useJUnitPlatform()
}